<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Surprise 🎂</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #3b1d5a, #151126 55%, #080711);

            color: white;
        }

        /* ✨ Stars */
        .stars {
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 20% 30%, white, transparent),
                radial-gradient(2px 2px at 70% 20%, white, transparent),
                radial-gradient(1px 1px at 40% 80%, white, transparent),
                radial-gradient(2px 2px at 85% 70%, white, transparent),
                radial-gradient(1px 1px at 10% 75%, white, transparent);
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.35;
            }

            to {
                opacity: 1;
            }
        }

        /* 🎁 Main card */
        .card {
            position: relative;
            z-index: 2;

            width: min(90%, 430px);
            padding: 45px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);

            border-radius: 25px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.45),
                0 0 40px rgba(190, 100, 255, 0.15);
        }

        .emoji {
            font-size: 65px;
            margin-bottom: 15px;

            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #ddd;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .hint {
            font-size: 13px;
            color: #bbb;
            margin-top: 15px;
        }

        /* 🔐 Password */
        #password {
            width: 100%;
            padding: 15px;

            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 12px;

            outline: none;

            background: rgba(0,0,0,0.25);
            color: white;

            font-size: 16px;

            text-align: center;
        }

        #password::placeholder {
            color: #aaa;
        }

        #password:focus {
            border-color: #d08cff;

            box-shadow:
                0 0 15px rgba(208,140,255,0.35);
        }

        /* 🎁 Button */
        button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(135deg, #b45cff, #ff65a3);

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(255, 101, 163, 0.3);
        }

        button:active {
            transform: scale(0.97);
        }

        #message {
            margin-top: 20px;
            min-height: 24px;
            font-weight: bold;
        }

        /* 🎈 Floating balloons */
        .balloon {
            position: fixed;
            bottom: -100px;
            font-size: 45px;
            z-index: 1;

            animation: rise 12s linear infinite;
        }

        .balloon.one {
            left: 8%;
            animation-delay: 1s;
        }

        .balloon.two {
            right: 10%;
            animation-delay: 5s;
        }

        .balloon.three {
            left: 75%;
            animation-delay: 8s;
        }

        @keyframes rise {
            from {
                transform: translateY(0) rotate(-5deg);
            }

            to {
                transform: translateY(-120vh) rotate(8deg);
            }
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <div class="balloon one">🎈</div>
    <div class="balloon two">🎈</div>
    <div class="balloon three">🎈</div>

    <div class="card">

        <div class="emoji">🎂</div>

        <h1>A Little Surprise Awaits ✨</h1>

        <p class="subtitle">
            Someone has prepared something special for you... ❤️
            <br>
            But first, you need the secret password 👀
        </p>

        <form id="loginForm">

            <input
                type="password"
                id="password"
                placeholder="🔐 Enter the secret password"
                required
            >

            <button type="submit">
                Unlock My Surprise 🎁
            </button>

        </form>

        <p class="hint">
            💡 Only someone special knows the secret...
        </p>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
